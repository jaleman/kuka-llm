# Step 4 rehearsal: continued pretraining on the cleaned dataset, Mac mini 16 GB.
# Real run (Qwen3-8B, PyTorch/CUDA) happens on the DGX Spark with the same data.
model: mlx-community/Qwen3-1.7B-bf16
train: true
data: data/out/cpt               # from data/build_cpt_dataset.py
fine_tune_type: lora
optimizer: adamw
num_layers: -1                   # all 28 blocks: knowledge lives everywhere, not just the top
lora_parameters:
  rank: 16                       # 2x the toy run; more capacity to absorb facts
  scale: 20.0
  dropout: 0.0
batch_size: 2
grad_accumulation_steps: 2       # optimizer updates every 2 iters: effective batch 4 (~2.5k tokens)
iters: 600                       # resumed run: 600 more iters from the run-1 checkpoint at iter 100
lr_schedule:
  name: cosine_decay
  warmup: 10
  arguments: [3.0e-5, 600, 3.0e-6]   # peak, decay steps, floor — 1e-4 destabilised run 1
max_seq_length: 2048
val_batches: -1                  # whole validation set (36 rows) every eval
steps_per_report: 10
steps_per_eval: 50
save_every: 100
adapter_path: train/runs/cpt-mac/adapters
resume_adapter_file: train/runs/cpt-mac-run1/adapters/0000100_adapters.safetensors
grad_checkpoint: true
seed: 0
test: true
test_batches: -1
